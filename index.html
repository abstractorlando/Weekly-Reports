<style>
:root {
  --pink:#FF1D8E; --teal:#00A9B5; --purple:#7C5CBF; --gold:#F4B942; --sky:#4EB3D3;
  --black:#0a0a0a; --card:#141414; --card2:#1a1a1a; --border:#252525;
  --text:#f0f0f0; --muted:#777; --dim:#444;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--black); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
h1,h2,h3 { font-family:'DM Serif Display',serif; }

/* HEADER */
.header { padding:28px 28px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:16px; }
.header h1 { font-size:1.6rem; color:var(--pink); letter-spacing:-0.5px; }
.header-sub { color:var(--muted); font-size:13px; }

/* WEEK TABS */
.week-tabs { display:flex; flex-wrap:wrap; gap:6px; padding:14px 28px; border-bottom:1px solid var(--border); }
.tab { padding:5px 13px; border-radius:20px; border:1px solid var(--border); background:none; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:12px; transition:all .15s; white-space:nowrap; }
.tab:hover { border-color:var(--pink); color:var(--text); }
.tab.active { background:var(--pink); border-color:var(--pink); color:#fff; font-weight:700; }

/* MAIN */
.main { padding:24px 28px; max-width:1500px; margin:0 auto; }
.section-label { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:2.5px; margin:28px 0 12px; font-weight:600; font-family:'DM Sans',sans-serif; }

/* KPI GRID */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 18px 16px; display:flex; flex-direction:column; gap:0; }
.kpi-label { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:8px; font-weight:600; }
.kpi-value { font-size:1.95rem; font-family:'DM Serif Display',serif; line-height:1; }
.kpi-sub { font-size:11px; color:var(--muted); margin-top:7px; line-height:1.4; }
.kpi-accent { width:28px; height:3px; border-radius:2px; margin-top:12px; }

/* RATIO GRID */
.ratio-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
.ratio-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
.ratio-label { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:8px; font-weight:600; }
.ratio-value { font-size:1.75rem; font-family:'DM Serif Display',serif; line-height:1; }
.ratio-sub { font-size:11px; color:var(--muted); margin-top:7px; }

/* PROMO GRID */
.promo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.promo-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center; }
.promo-name { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:12px; font-weight:600; }
.promo-val { font-size:1.75rem; font-family:'DM Serif Display',serif; }
.split-pills { display:flex; gap:8px; justify-content:center; margin-top:4px; }
.pill { flex:1; border-radius:10px; padding:10px 4px; text-align:center; }
.pill-label { font-size:8px; text-transform:uppercase; letter-spacing:1px; opacity:.65; margin-bottom:3px; font-weight:700; }
.pill-val { font-size:1.5rem; font-family:'DM Serif Display',serif; }

/* CHARTS */
.charts-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; }
.chart-title { font-size:12px; color:var(--text); font-weight:600; margin-bottom:4px; letter-spacing:.2px; text-transform:uppercase; }
.chart-subtitle { font-size:11px; color:var(--muted); margin-bottom:16px; }
.chart-wrap { position:relative; height:200px; }
</style>
</head>

function fmt(n) {
  if (n === null || n === undefined) return '—';
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtK(n) {
  if (n === null || n === undefined) return '—';
  if (n >= 1000) return '$' + (n/1000).toFixed(1) + 'k';
  return '$' + n.toFixed(0);
}
function fmtN(n) { if (n === null || n === undefined) return '—'; return n.toLocaleString(); }
function fmtPct(n) { if (n === null || n === undefined) return '—'; return n.toFixed(1) + '%'; }

function kpiCard(label, value, sub, accentColor) {
  return '<div class="kpi">' +
    '<div class="kpi-label">' + label + '</div>' +
    '<div class="kpi-value" style="color:' + accentColor + '">' + value + '</div>' +
    (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') +
    '<div class="kpi-accent" style="background:' + accentColor + '"></div>' +
    '</div>';
}
function ratioCard(label, value, sub, accentColor) {
  return '<div class="ratio-card">' +
    '<div class="ratio-label">' + label + '</div>' +
    '<div class="ratio-value" style="color:' + accentColor + '">' + value + '</div>' +
    (sub ? '<div class="ratio-sub">' + sub + '</div>' : '') +
    '</div>';
}

function splitCard(name, aVal, bVal, aColor, bColor, aLabel, bLabel) {
  if (aVal === null && bVal === null) {
    return '<div class="promo-card"><div class="promo-name">' + name + '</div><div class="promo-val" style="color:var(--muted)">—</div></div>';
  }
  var aD = (aVal === null || aVal === undefined) ? '—' : aVal;
  var bD = (bVal === null || bVal === undefined) ? '—' : bVal;
  return '<div class="promo-card"><div class="promo-name">' + name + '</div>' +
    '<div class="split-pills">' +
    '<div class="pill" style="background:' + aColor + '18"><div class="pill-label" style="color:' + aColor + '">' + aLabel + '</div><div class="pill-val" style="color:' + aColor + '">' + aD + '</div></div>' +
    '<div class="pill" style="background:' + bColor + '18"><div class="pill-label" style="color:' + bColor + '">' + bLabel + '</div><div class="pill-val" style="color:' + bColor + '">' + bD + '</div></div>' +
    '</div></div>';
}

function renderWeek(idx) {
  var w = WEEKS[idx];

  var revPerGuest = (w.total && w.guests)    ? (w.total / w.guests)        : null;
  var fhShare     = (w.fh && w.total)        ? (w.fh / w.total * 100)      : null;
  var toastShare  = (w.toast && w.total)     ? (w.toast / w.total * 100)   : null;

  var kpiHTML = '<div class="kpi-grid">';
  kpiHTML += kpiCard('Total Revenue',   fmt(w.total),    'FH + Toast combined',                        'var(--pink)');
  kpiHTML += kpiCard('FareHarbor',      fmt(w.fh),       fhShare ? fmtPct(fhShare) + ' of total'  : null, 'var(--teal)');
  kpiHTML += kpiCard('Toast POS',       fmt(w.toast),    toastShare ? fmtPct(toastShare) + ' of total' : null, 'var(--sky)');
  kpiHTML += kpiCard('Tips',            fmt(w.tips),     tipOfRev ? fmtPct(tipOfRev) + ' of revenue' : null, 'var(--gold)');
  kpiHTML += kpiCard('Tip %',           w.tipPct !== null ? w.tipPct.toFixed(2) + '%' : '—', 'Guest tip rate on Toast', 'var(--gold)');
  if (w.gratuity > 0 || w.gratuity === 0) {
    kpiHTML += kpiCard('Gratuity',      fmt(w.gratuity), w.gratuity > 0 ? 'Auto-grat collected' : 'No auto-grat this week', 'var(--purple)');
  }
  kpiHTML += kpiCard('Google Reviews',  fmtN(w.reviews), 'New reviews this week',                     'var(--pink)');
  kpiHTML += kpiCard('Total Guests',    fmtN(w.guests),  'FT: ' + fmtN(w.ft) + '  ·  RG: ' + fmtN(w.rg), 'var(--teal)');
  if (w.pickups !== null) {

  }
  kpiHTML += kpiCard('Payroll',         fmt(w.payroll),  payrollPct ? fmtPct(payrollPct) + ' of revenue' : null, 'var(--sky)');

  if (w.guests && w.reviews !== null) {
    var revPerGuest2 = (w.reviews / w.guests * 100);
    ratioHTML += ratioCard('Review Conversion', fmtPct(revPerGuest2),     w.reviews + ' reviews from ' + w.guests + ' guests',                               'var(--pink)');

  var reviews_arr    = WEEKS.map(function(x){ return x.reviews; });
  var guests_arr     = WEEKS.map(function(x){ return x.guests; });
  var payrollPct_arr = WEEKS.map(function(x){ return (x.payroll&&x.total)?parseFloat((x.payroll/x.total*100).toFixed(1)):null; });
  var revPerG_arr    = WEEKS.map(function(x){ return (x.total&&x.guests)?parseFloat((x.total/x.guests).toFixed(2)):null; });

  var chartsHTML = '<div class="charts-grid">' +
    '<div class="chart-card"><div class="chart-title">Total Revenue</div><div class="chart-subtitle">All weeks — FH + Toast</div><div class="chart-wrap"><canvas id="cRevenue"></canvas></div></div>' +
    '<div class="chart-card"><div class="chart-title">Tips</div><div class="chart-subtitle">Total tips collected each week</div><div class="chart-wrap"><canvas id="cTips"></canvas></div></div>' +
    '<div class="chart-card"><div class="chart-title">Total Guests</div><div class="chart-subtitle">FT + RG combined</div><div class="chart-wrap"><canvas id="cGuests"></canvas></div></div>' +
    '<div class="chart-card"><div class="chart-title">Revenue per Guest</div><div class="chart-subtitle">Total revenue ÷ guests</div><div class="chart-wrap"><canvas id="cRevPerGuest"></canvas></div></div>' +
    '<div class="chart-card"><div class="chart-title">Payroll % of Revenue</div><div class="chart-subtitle">Labor cost as a share of weekly revenue</div><div class="chart-wrap"><canvas id="cPayrollPct"></canvas></div></div>' +
    '<div class="chart-card"><div class="chart-title">Google Reviews</div><div class="chart-subtitle">New reviews per week</div><div class="chart-wrap"><canvas id="cReviews"></canvas></div></div>' +
    '</div>';

  document.getElementById('main').innerHTML =
    '<div class="section-label">Revenue & KPIs</div>' + kpiHTML +
    '<div class="section-label">Efficiency Ratios</div>' + ratioHTML +
    '<div class="section-label">Promotions</div>' + promoHTML +
    '<div class="section-label">Trends — All Weeks</div>' + chartsHTML;

  // Chart defaults
  var xScale = { ticks:{ color:'#555', font:{ size:9 }, maxRotation:45 }, grid:{ color:'#1e1e1e' } };
  var yScale = { ticks:{ color:'#555' }, grid:{ color:'#1e1e1e' } };
  var yPct   = { ticks:{ color:'#555', callback:function(v){ return v+'%'; } }, grid:{ color:'#1e1e1e' } };
  var yDollar= { ticks:{ color:'#555', callback:function(v){ return '$'+v; } }, grid:{ color:'#1e1e1e' } };
  var base   = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:xScale, y:yScale } };

  new Chart(document.getElementById('cRevenue'),    { type:'bar', data:{ labels:labels, datasets:[{ data:totals,         backgroundColor:PINK,   borderRadius:3, borderSkipped:false }]}, options:Object.assign({},base,{ scales:{ x:xScale, y:yDollar } }) });
  new Chart(document.getElementById('cTips'),       { type:'bar', data:{ labels:labels, datasets:[{ data:tips_arr,       backgroundColor:GOLD,   borderRadius:3, borderSkipped:false }]}, options:Object.assign({},base,{ scales:{ x:xScale, y:yDollar } }) });
  new Chart(document.getElementById('cGuests'),     { type:'bar', data:{ labels:labels, datasets:[{ data:guests_arr,     backgroundColor:TEAL,   borderRadius:3, borderSkipped:false }]}, options:Object.assign({},base,{ scales:{ x:xScale, y:yScale } }) });
  new Chart(document.getElementById('cRevPerGuest'),{ type:'bar', data:{ labels:labels, datasets:[{ data:revPerG_arr,    backgroundColor:SKY,    borderRadius:3, borderSkipped:false }]}, options:Object.assign({},base,{ scales:{ x:xScale, y:yDollar } }) });
  new Chart(document.getElementById('cPayrollPct'), { type:'bar', data:{ labels:labels, datasets:[{ data:payrollPct_arr, backgroundColor:PURPLE, borderRadius:3, borderSkipped:false }]}, options:Object.assign({},base,{ scales:{ x:xScale, y:yPct   } }) });
  new Chart(document.getElementById('cReviews'),    { type:'bar', data:{ labels:labels, datasets:[{ data:reviews_arr,   backgroundColor:PINK,   borderRadius:3, borderSkipped:false }]}, options:Object.assign({},base,{ scales:{ x:xScale, y:yScale  } }) });
}

// Build tabs
var tabs = document.getElementById('tabs');
WEEKS.forEach(function(w, i) {
  var btn = document.createElement('button');
  btn.className = 'tab' + (i === WEEKS.length - 1 ? ' active' : '');
  btn.textContent = w.label;
  btn.onclick = function() {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    renderWeek(i);
  };
  tabs.appendChild(btn);
});
renderWeek(WEEKS.length - 1);
</script>
