<style>
:root {
  --pink:#FF1D8E; --teal:#00A9B5; --purple:#5B3FA6;
  --green:#00C896; --amber:#F59E0B; --red:#EF4444;
  --black:#0a0a0a; --card:#141414; --border:#222;
  --text:#f0f0f0; --muted:#888;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--black); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
h1,h2,h3 { font-family:'DM Serif Display',serif; }
.header { padding:32px 24px 16px; border-bottom:1px solid var(--border); }
.header h1 { font-size:2rem; color:var(--pink); }
.header p { color:var(--muted); margin-top:4px; }
.week-tabs { display:flex; flex-wrap:wrap; gap:8px; padding:16px 24px; border-bottom:1px solid var(--border); }
.tab { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:none; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; transition:all .2s; }
.tab:hover { border-color:var(--pink); color:var(--text); }
.tab.active { background:var(--pink); border-color:var(--pink); color:#fff; font-weight:700; }
.main { padding:24px; max-width:1400px; margin:0 auto; }
.section-title { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin:28px 0 14px; font-weight:500; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
.kpi-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:6px; }
.kpi-value { font-size:2rem; font-family:'DM Serif Display',serif; }
.kpi-sub { font-size:12px; color:var(--muted); margin-top:4px; }
.kpi-bar { height:4px; border-radius:2px; background:var(--border); margin-top:10px; }
.kpi-bar-fill { height:100%; border-radius:2px; }
.ratio-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
.ratio-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:6px; }
.ratio-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
.ratio-value { font-size:2rem; font-family:'DM Serif Display',serif; }
.ratio-sub { font-size:12px; color:var(--muted); }
.ratio-bar { height:4px; border-radius:2px; background:var(--border); margin-top:6px; }
.ratio-bar-fill { height:100%; border-radius:2px; }
.badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; margin-top:4px; letter-spacing:.5px; }
.badge-green { background:rgba(0,200,150,.15); color:var(--green); }
.badge-amber { background:rgba(245,158,11,.15); color:var(--amber); }
.badge-red   { background:rgba(239,68,68,.15);  color:var(--red); }
.promo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.promo-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; }
.promo-name { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.promo-val { font-size:2rem; font-family:'DM Serif Display',serif; }
.split-pills { display:flex; gap:8px; justify-content:center; margin-top:8px; }
.pill { flex:1; border-radius:8px; padding:8px 4px; text-align:center; }
.pill-label { font-size:9px; text-transform:uppercase; letter-spacing:1px; opacity:.7; }
.pill-val { font-size:1.4rem; font-family:'DM Serif Display',serif; }
.charts-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; }
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
.chart-card h3 { font-size:1rem; margin-bottom:16px; color:var(--text); }
.chart-wrap { position:relative; height:220px; }
</style>
</head>

function fmt(n) {
  if (n === null || n === undefined) return '—';
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtN(n) { if (n === null || n === undefined) return '—'; return n.toLocaleString(); }
function fmtPct(n) { if (n === null || n === undefined) return '—'; return n.toFixed(1) + '%'; }
function pct(val, target) { return Math.min(100, (val / target) * 100); }
function revColor(val, target) {
  if (val === null || val === undefined) return 'var(--muted)';
  var p = val / target;
  if (p >= 1) return 'var(--green)';
  if (p >= 0.75) return 'var(--amber)';
  return 'var(--red)';
}
function costColor(val, target) {
  if (val === null || val === undefined) return 'var(--muted)';
  if (val <= target * 0.85) return 'var(--green)';
  if (val <= target) return 'var(--amber)';
  return 'var(--red)';
}
function badge(val, target, lowerBetter) {
  if (val === null || val === undefined) return '';
  var good, warn;
  if (lowerBetter) { good = val <= target * 0.85; warn = val <= target; }
  else { good = val >= target; warn = val >= target * 0.75; }
  if (good) return '<span class="badge badge-green">ON TARGET</span>';
  if (warn) return '<span class="badge badge-amber">CLOSE</span>';
  return '<span class="badge badge-red">NEEDS ATTENTION</span>';
}

function simpleCard(name, val, col) {
  var d = (val === null || val === undefined) ? '—' : val;
  return '<div class="promo-card"><div class="promo-name">' + name + '</div><div class="promo-val" style="color:' + col + '">' + d + '</div></div>';
}
function splitCard(name, aVal, bVal, aColor, bColor, aLabel, bLabel) {
  if (aVal === null && bVal === null) {
    return '<div class="promo-card"><div class="promo-name">' + name + '</div><div class="promo-val" style="color:var(--muted)">—</div></div>';
  }
  var aD = (aVal === null || aVal === undefined) ? '—' : aVal;
  var bD = (bVal === null || bVal === undefined) ? '—' : bVal;
  return '<div class="promo-card"><div class="promo-name">' + name + '</div>' +
    '<div class="split-pills">' +
    '<div class="pill" style="background:' + aColor + '22"><div class="pill-label" style="color:' + aColor + '">' + aLabel + '</div><div class="pill-val" style="color:' + aColor + '">' + aD + '</div></div>' +
    '<div class="pill" style="background:' + bColor + '22"><div class="pill-label" style="color:' + bColor + '">' + bLabel + '</div><div class="pill-val" style="color:' + bColor + '">' + bD + '</div></div>' +
    '</div></div>';
}
function ratioCard(label, value, displayVal, sub, lowerBetter, tgt) {
  var col = lowerBetter ? costColor(value, tgt) : revColor(value, tgt);
  var b = badge(value, tgt, lowerBetter);
  var barW = value !== null ? Math.min(100, (value / tgt) * 100) : 0;
  return '<div class="ratio-card"><div class="ratio-label">' + label + '</div>' +
    '<div class="ratio-value" style="color:' + col + '">' + displayVal + '</div>' +
    '<div class="ratio-sub">' + sub + '</div>' + b +
    '<div class="ratio-bar"><div class="ratio-bar-fill" style="width:' + barW + '%;background:' + col + '"></div></div></div>';
}

function renderWeek(idx) {

  var payrollPct  = (w.payroll && w.total)   ? (w.payroll  / w.total * 100) : null;
  var tipTotalPct = (w.tips   && w.total)    ? (w.tips     / w.total * 100) : null;
  var gratuityPct = (w.gratuity && w.total && w.gratuity > 0) ? (w.gratuity / w.total * 100) : null;
  var revPerGuest = (w.total  && w.guests)   ? (w.total    / w.guests)      : null;
  var fhShare     = (w.fh    && w.total)     ? (w.fh       / w.total * 100) : null;
  var toastShare  = (w.toast && w.total)     ? (w.toast    / w.total * 100) : null;

  var kpiHTML = '<div class="kpi-grid">';
  var tc = revColor(w.total, T.total);
  kpiHTML += '<div class="kpi"><div class="kpi-label">Total Revenue</div><div class="kpi-value" style="color:' + tc + '">' + fmt(w.total) + '</div><div class="kpi-sub">Target: ' + fmt(T.total) + '</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:' + pct(w.total,T.total) + '%;background:' + tc + '"></div></div></div>';
  var fc = revColor(w.fh, T.fh);
  kpiHTML += '<div class="kpi"><div class="kpi-label">FareHarbor</div><div class="kpi-value" style="color:' + fc + '">' + fmt(w.fh) + '</div><div class="kpi-sub">Target: ' + fmt(T.fh) + '</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:' + pct(w.fh,T.fh) + '%;background:' + fc + '"></div></div></div>';
  var toastc = revColor(w.toast, T.toast);
  kpiHTML += '<div class="kpi"><div class="kpi-label">Toast POS</div><div class="kpi-value" style="color:' + toastc + '">' + fmt(w.toast) + '</div><div class="kpi-sub">Target: ' + fmt(T.toast) + '</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:' + pct(w.toast,T.toast) + '%;background:' + toastc + '"></div></div></div>';
  var tipvc = revColor(w.tips, T.tips);
  kpiHTML += '<div class="kpi"><div class="kpi-label">Tips (Cash)</div><div class="kpi-value" style="color:' + tipvc + '">' + fmt(w.tips) + '</div><div class="kpi-sub">Target: ' + fmt(T.tips) + '</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:' + pct(w.tips,T.tips) + '%;background:' + tipvc + '"></div></div></div>';
  var tpColor = revColor(w.tipPct, T.tipPct);
  kpiHTML += '<div class="kpi"><div class="kpi-label">Tip %</div><div class="kpi-value" style="color:' + tpColor + '">' + (w.tipPct !== null ? w.tipPct.toFixed(2) + '%' : '—') + '</div><div class="kpi-sub">Target: ' + T.tipPct + '%</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:' + pct(w.tipPct,T.tipPct) + '%;background:' + tpColor + '"></div></div></div>';
  var grc = revColor(w.gratuity, T.gratuity);
  kpiHTML += '<div class="kpi"><div class="kpi-label">Gratuity</div><div class="kpi-value" style="color:' + grc + '">' + fmt(w.gratuity) + '</div><div class="kpi-sub">Target: ' + fmt(T.gratuity) + '</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:' + pct(w.gratuity,T.gratuity) + '%;background:' + grc + '"></div></div></div>';
  var rc = revColor(w.reviews, T.reviews);
  kpiHTML += '<div class="kpi"><div class="kpi-label">Google Reviews</div><div class="kpi-value" style="color:' + rc + '">' + fmtN(w.reviews) + '</div><div class="kpi-sub">Target: ' + T.reviews + '</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:' + pct(w.reviews,T.reviews) + '%;background:' + rc + '"></div></div></div>';
  kpiHTML += '<div class="kpi"><div class="kpi-label">Total Guests</div><div class="kpi-value" style="color:var(--teal)">' + fmtN(w.guests) + '</div><div class="kpi-sub">FT: ' + fmtN(w.ft) + ' | RG: ' + fmtN(w.rg) + '</div></div>';
  kpiHTML += '<div class="kpi"><div class="kpi-label">Pickups</div><div class="kpi-value" style="color:var(--purple)">' + fmtN(w.pickups) + '</div></div>';
  var pc2 = costColor(payrollPct, T.payrollPct);
  kpiHTML += '<div class="kpi"><div class="kpi-label">Payroll</div><div class="kpi-value" style="color:' + pc2 + '">' + fmt(w.payroll) + '</div><div class="kpi-sub">' + fmtPct(payrollPct) + ' of revenue</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:' + Math.min(100,(payrollPct/T.payrollPct)*100) + '%;background:' + pc2 + '"></div></div></div>';
  kpiHTML += '</div>';

  var ratioHTML = '<div class="ratio-grid">';
  if (payrollPct !== null)   ratioHTML += ratioCard('Payroll % of Revenue', payrollPct,  fmtPct(payrollPct),  'Target: under ' + T.payrollPct + '% — lower is better', true,  T.payrollPct);
  if (tipTotalPct !== null)  ratioHTML += ratioCard('Tips as % of Revenue', tipTotalPct, fmtPct(tipTotalPct), fmt(w.tips) + ' tips on ' + fmt(w.total),                  false, 11.25);
  if (gratuityPct !== null)  ratioHTML += ratioCard('Gratuity % of Revenue',gratuityPct, fmtPct(gratuityPct),fmt(w.gratuity) + ' gratuity on ' + fmt(w.total),            false, 5);
  if (revPerGuest !== null)  ratioHTML += ratioCard('Revenue per Guest',    revPerGuest,  fmt(revPerGuest),    w.guests + ' guests this week',                              false, T.revPerGuest);
  if (fhShare !== null)      ratioHTML += ratioCard('FareHarbor Share',     fhShare,      fmtPct(fhShare),    fmt(w.fh) + ' of ' + fmt(w.total),                           false, 25);
  if (toastShare !== null)   ratioHTML += ratioCard('Toast Share',          toastShare,   fmtPct(toastShare), fmt(w.toast) + ' of ' + fmt(w.total),                        false, 75);
  ratioHTML += '</div>';

  var promoHTML = '<div class="promo-grid">';
  promoHTML += simpleCard('Coaster Upsell', w.coaster, 'var(--teal)');
  promoHTML += splitCard('BDAYGIFT', w.fh_bday, w.toast_bday, 'var(--pink)', 'var(--green)', 'FH Booked', 'Studio Used');
  promoHTML += simpleCard('Groupon $20 Used', w.g20_u, 'var(--amber)');
  promoHTML += simpleCard('Groupon Canvas Used', w.gc_u, 'var(--amber)');
  promoHTML += splitCard('Golden Ticket', w.gt_i, w.gt_u, 'var(--amber)', 'var(--green)', 'Issued', 'Used');
  promoHTML += simpleCard('$25 Thank You Cards', w.thankyou, 'var(--text)');
  promoHTML += '</div>';

  var labels = WEEKS.map(function(x){ return x.label; });
  var totals = WEEKS.map(function(x){ return x.total; });
  var tips_arr = WEEKS.map(function(x){ return x.tips; });
  var reviews_arr = WEEKS.map(function(x){ return x.reviews; });
  var guests_arr = WEEKS.map(function(x){ return x.guests; });
  var payrollPct_arr = WEEKS.map(function(x){ return (x.payroll&&x.total)?parseFloat((x.payroll/x.total*100).toFixed(1)):null; });
  var revPerGuest_arr = WEEKS.map(function(x){ return (x.total&&x.guests)?parseFloat((x.total/x.guests).toFixed(2)):null; });

  var chartsHTML = '<div class="charts-grid">' +
    '<div class="chart-card"><h3>Total Revenue — All Weeks</h3><div class="chart-wrap"><canvas id="cRevenue"></canvas></div></div>' +
    '<div class="chart-card"><h3>Payroll % of Revenue — All Weeks</h3><div class="chart-wrap"><canvas id="cPayrollPct"></canvas></div></div>' +
    '<div class="chart-card"><h3>Revenue per Guest — All Weeks</h3><div class="chart-wrap"><canvas id="cRevPerGuest"></canvas></div></div>' +
    '<div class="chart-card"><h3>Tips — All Weeks</h3><div class="chart-wrap"><canvas id="cTips"></canvas></div></div>' +
    '<div class="chart-card"><h3>Google Reviews — All Weeks</h3><div class="chart-wrap"><canvas id="cReviews"></canvas></div></div>' +
    '<div class="chart-card"><h3>Total Guests — All Weeks</h3><div class="chart-wrap"><canvas id="cGuests"></canvas></div></div>' +
    '</div>';

  document.getElementById('main').innerHTML =
    '<div class="section-title">Revenue & KPIs</div>' + kpiHTML +
    '<div class="section-title">Efficiency Ratios</div>' + ratioHTML +
    '<div class="section-title">Promotions</div>' + promoHTML +
    '<div class="section-title">Trends</div>' + chartsHTML;

  var baseOpts = { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#888',font:{size:9}},grid:{color:'#222'}}, y:{ticks:{color:'#888'},grid:{color:'#222'}} } };
  var pctOpts  = { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#888',font:{size:9}},grid:{color:'#222'}}, y:{ticks:{color:'#888',callback:function(v){return v+'%';}},grid:{color:'#222'}} } };
  var dollarOpts={ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#888',font:{size:9}},grid:{color:'#222'}}, y:{ticks:{color:'#888',callback:function(v){return '$'+v;}},grid:{color:'#222'}} } };

  new Chart(document.getElementById('cRevenue'),    { type:'bar', data:{ labels:labels, datasets:[{ data:totals, backgroundColor:totals.map(function(v){ return v>=T.total?'rgba(0,200,150,.7)':v>=T.total*.75?'rgba(245,158,11,.7)':'rgba(239,68,68,.7)'; }), borderRadius:4 }, { type:'line', data:labels.map(function(){ return T.total; }), borderColor:'rgba(255,255,255,.3)', borderDash:[4,4], pointRadius:0 }]}, options:baseOpts });
  new Chart(document.getElementById('cPayrollPct'), { type:'bar', data:{ labels:labels, datasets:[{ data:payrollPct_arr, backgroundColor:payrollPct_arr.map(function(v){ return v===null?'rgba(100,100,100,.3)':v<=T.payrollPct*.85?'rgba(0,200,150,.7)':v<=T.payrollPct?'rgba(245,158,11,.7)':'rgba(239,68,68,.7)'; }), borderRadius:4 }, { type:'line', data:labels.map(function(){ return T.payrollPct; }), borderColor:'rgba(255,255,255,.3)', borderDash:[4,4], pointRadius:0 }]}, options:pctOpts });
  new Chart(document.getElementById('cRevPerGuest'),{ type:'bar', data:{ labels:labels, datasets:[{ data:revPerGuest_arr, backgroundColor:revPerGuest_arr.map(function(v){ return v===null?'rgba(100,100,100,.3)':v>=T.revPerGuest?'rgba(0,200,150,.7)':v>=T.revPerGuest*.75?'rgba(245,158,11,.7)':'rgba(239,68,68,.7)'; }), borderRadius:4 }, { type:'line', data:labels.map(function(){ return T.revPerGuest; }), borderColor:'rgba(255,255,255,.3)', borderDash:[4,4], pointRadius:0 }]}, options:dollarOpts });
  new Chart(document.getElementById('cTips'),       { type:'bar', data:{ labels:labels, datasets:[{ data:tips_arr, backgroundColor:'rgba(0,169,181,.7)', borderRadius:4 }]}, options:baseOpts });
  new Chart(document.getElementById('cReviews'),    { type:'bar', data:{ labels:labels, datasets:[{ data:reviews_arr, backgroundColor:reviews_arr.map(function(v){ return v===null?'rgba(100,100,100,.4)':v>=T.reviews?'rgba(0,200,150,.7)':'rgba(245,158,11,.7)'; }), borderRadius:4 }, { type:'line', data:labels.map(function(){ return T.reviews; }), borderColor:'rgba(255,255,255,.3)', borderDash:[4,4], pointRadius:0 }]}, options:baseOpts });
  new Chart(document.getElementById('cGuests'),     { type:'bar', data:{ labels:labels, datasets:[{ data:guests_arr, backgroundColor:'rgba(91,63,166,.7)', borderRadius:4 }]}, options:baseOpts });
}

var tabs = document.getElementById('tabs');
WEEKS.forEach(function(w, i) {
  var btn = document.createElement('button');
  btn.className = 'tab' + (i === WEEKS.length - 1 ? ' active' : '');
  btn.textContent = w.label;
  btn.onclick = function() {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    renderWeek(i);
  };
  tabs.appendChild(btn);
});
renderWeek(WEEKS.length - 1);
</script>
</body>
</html>
